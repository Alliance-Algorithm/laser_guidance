# =============================================================================
# HikCamera 工业相机配置
#
# 使用方式:
#   ./build/tool_preview config/capture_hik.yaml
#   ./build/tool_competition config/capture_hik.yaml
#
# 切换回 V4L2 USB 相机:
#   将 capture_backend 改为 v4l2，或直接使用 config/default.yaml
# =============================================================================

# --- 采集后端选择 -----------------------------------------------------------
capture_backend: hikcamera    # v4l2 (USB相机) | hikcamera (海康工业相机)

# --- HikCamera 参数 (仅 capture_backend: hikcamera 时生效) -----------------
hik:
  # 设备标识：相机序列号 / 用户自定义名称 / 型号
  # 留空则自动选择第一个枚举到的设备（仅当只有一台相机时安全）
  device_id: ""

  # 取图超时 (ms)
  timeout_ms: 2000

  # 曝光时间 (us)，范围取决于具体型号，常见 10~1000000
  exposure_us: 2000.0

  # 帧率 (fps)，需与相机支持的帧率匹配
  framerate: 80.0

  # 模拟增益 (dB)，max 约 16.98 (取决于型号)
  gain: 16.9807

  # 图像水平翻转
  invert_image: false

  # 软件触发同步（需相机支持 hardware trigger 或 software trigger）
  software_sync: false

  # 硬件触发模式 (software_sync 开启时自动设为 software trigger source)
  trigger_mode: false

  # 固定帧率使能（关闭时使用相机默认帧率）
  fixed_framerate: true

# --- V4L2 参数 (capture_backend: hikcamera 时忽略，保留供快速切换参考) -----
v4l2:
  device_path: /dev/v4l/by-id/usb-UGREEN_UGREEN_95348_20250910-video-index0
  width: 1920
  height: 1080
  framerate: 60.0
  pixel_format: mjpeg
  invert_image: false

# --- 以下为通用配置，与采集后端无关 -----------------------------------------

debug:
  show_window: true
  draw_overlay: true

runtime:
  max_input_age_ms: 25
  max_observation_age_ms: 35
  max_infer_fps: 60
  warmup_frames: 30
  engine_path: "models/exp.engine"
  hit_confirm_frames: 3
  hit_release_frames: 5
  debug_enabled: true
  debug_max_fps: 30
  record_enabled: true
  record_queue_size: 16

inference:
  backend: model
  model_path: models/exp.onnx

streaming:
  enabled: true
  host: "127.0.0.1"
  port: 5004
  sdp_path: "/tmp/laser_guidance.sdp"
  encoder: "h264_nvenc"

udp:
  enabled: true
  host: "127.0.0.1"
  port: 5001

ekf:
  process_noise_q: 0.05
  measurement_noise_r: 0.5
  initial_pos_std: 100.0
  initial_vel_std: 100.0
  initial_acc_std: 50.0
  max_missed_frames: 5
  lookahead_ms: 12.0

guidance:
  enabled: true
  command_model: geometry
  target_geometry:
    - class_id: 0
      width_mm: 72.0
      height_mm: 50.0
    - class_id: 1
      width_mm: 72.0
      height_mm: 50.0
    - class_id: 2
      width_mm: 72.0
      height_mm: 50.0
  camera_calib_path: "config/camera_calib.yaml"
  t_x_mm: -97.0
  t_y_mm: 15.1
  t_z_mm: 146.0
  r_x_deg: 0.31
  r_y_deg: 0.05
  r_z_deg: 1.82
  mirror_separation_mm: 15.0
  max_optical_angle_deg: 30.0
  input_voltage_range_v: 5.0
  dac_voltage_range_v: 10.0
  voltage_model_path: "models/vision_voltage_lut.example.yaml"
  voltage_use_ekf_center: true
  voltage_limit_v: 5.0
  wiring:
    mode: differential
    x_plus_channel: 0
    x_minus_channel: 2
    y_plus_channel: 1
    y_minus_channel: 3
  scan_mode: rectangle
  scan_width_deg: 0.12
  scan_height_deg: 0.16
  scan_grid_n: 8
