capture_backend: hikcamera
hik:
  device_id: 'DB0864607'
  timeout_ms: 1000
  exposure_us: 500
  framerate: 80.0
  gain: 10
  invert_image: false
  software_sync: false
  trigger_mode: false
  fixed_framerate: true
  white_balance_auto: off
  profile_unlit:
    exposure_us: 20000
    gain: 16.9
    framerate: 50.0
    white_balance_auto: continuous
v4l2:
  device_path: /dev/v4l/by-id/usb-MACROSILICON_Hagibis_20210623-video-index0
  width: 1920
  height: 1080
  framerate: 60.0
  pixel_format: mjpeg
  invert_image: false
debug:
  show_window: true
  draw_overlay: true
runtime:
  max_input_age_ms: 25
  max_observation_age_ms: 50
  max_infer_fps: 80
  warmup_frames: 30
  engine_path: models/exp-900-901.engine
  hit_confirm_frames: 3
  hit_release_frames: 5
  debug_enabled: true
  debug_max_fps: 30
  record_enabled: false
  record_queue_size: 16
inference:
  backend: tensorrt
  model_path: models/exp-900-901.engine
  enemy_color: auto
record:
  output_root: ./videos
  lighting_tag: competition
  background_tag: field
  distance_tag: variable
  target_color: purple
  frame_format: h264
  h264_qp: 23
streaming:
  enabled: true
  host: 127.0.0.1
  port: 5004
  sdp_path: /tmp/laser_guidance.sdp
  encoder: h264_nvenc
  bitrate: 16M
  max_width: 0
  max_fps: 0
udp:
  enabled: true
  host: 127.0.0.1
  port: 5002
zmq:
  enabled: false
  host: 127.0.0.1
  port: 5555
ekf:
  enabled: true
  process_noise_q: 0.35
  measurement_noise_r: 0.015
  initial_pos_std: 100.0
  initial_vel_std: 100.0
  initial_acc_std: 35.0
  max_missed_frames: 5
  lookahead_ms: 10.0
guidance:
  enabled: true
  command_model: geometry
  calib_mode: false
  target_geometry:
  - class_id: 0
    width_mm: 50.0
    height_mm: 72.0
  - class_id: 1
    width_mm: 50.0
    height_mm: 72.0
  - class_id: 2
    width_mm: 50.0
    height_mm: 72.0
  - class_id: 3
    width_mm: 50.0
    height_mm: 72.0
  camera_calib_path: config/camera_calib.yaml
  depth_filter_enabled: true
  depth_process_noise_q: 400.0
  depth_measurement_noise_r: 4000000.0
  depth_initial_pos_std: 5000.0
  depth_initial_vel_std: 2000.0
  depth_max_missed_frames: 5
  depth_scale: 1.007
  voltage_gain_x: 1.23
  voltage_gain_y: 1.22
  t_x_mm: 85.5
  t_y_mm: 15.0
  t_z_mm: 20.0
  r_x_deg: -0.750758059984
  r_y_deg: -0.477254806404
  r_z_deg: -0.277933218604
  mirror_separation_mm: 15.0
  max_optical_angle_deg: 30.0
  input_voltage_range_v: 5.0
  dac_voltage_range_v: 10.0
  wiring:
    mode: differential
    x_plus_channel: 2
    x_minus_channel: 0
    y_plus_channel: 3
    y_minus_channel: 1
